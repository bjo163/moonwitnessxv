name: Governance or documentation request
description: Propose a repository-governance or documentation improvement for triage.
title: "governance: "
labels:
  - type:governance
body:
  - type: markdown
    attributes:
      value: >-
        This form is for discussion and triage. It does not authorize implementation, create a task status,
        or replace TODO.md. Do not include secrets or private witness material.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the gap and the outcome you propose.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
      description: Identify likely documents or processes and anything that should remain out of scope.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Related canonical sources
      description: Link relevant TODO task IDs, ADRs, architecture documents, or evidence. Note possible overlap.
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Initial classification
      options:
        - Independent preparation candidate
        - Possible TODO overlap
        - Owner decision required
        - Read-only audit request
    validations:
      required: true
