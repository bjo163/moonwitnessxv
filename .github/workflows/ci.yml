name: CI Verify & Gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    name: Monorepo Verification & Safety Gates
    runs-on: ubuntu-latest

    steps:
      - name: Restrict main pull requests to the dev branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "Pull requests into main must come from this repository's dev branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Monorepo Verification (build, lint, gen:sdk:check, test, build:web)
        run: pnpm verify

  sync_pr:
    name: Ensure sync PR from dev to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: sync-dev-to-main
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check dev commits and manage PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:refs/remotes/origin/main

          BEHIND_COUNT=$(git rev-list --count refs/remotes/origin/main..HEAD)
          echo "Commits on dev ahead of main: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "dev has no new commits compared to main. No PR needed."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Open sync PR #$EXISTING_PR already exists from dev to main. GitHub will auto-update it with the latest dev commits."
            exit 0
          fi

          echo "No open sync PR found. Creating a new PR from dev to main..."
          gh pr create \
            --base main \
            --head dev \
            --title "chore(release): sync dev to main" \
            --body "## Summary
Automated staging promotion PR from dev to main.

### Status
- **Source:** \`dev\`
- **Target:** \`main\`
- **Safety checks:** Validated by \`Monorepo Verification & Safety Gates\`.

### Instructions for Maintainer
When ready to release staged changes to production:
1. Ensure all CI checks are green.
2. Review the commit log and changelog entries.
3. Merge this PR into \`main\`."
