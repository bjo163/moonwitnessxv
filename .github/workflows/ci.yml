name: CI Verify & Gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    name: Monorepo Verification & Safety Gates
    runs-on: ubuntu-latest

    steps:
      - name: Restrict main pull requests to the dev branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "Pull requests into main must come from this repository's dev branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Monorepo Verification (build, lint, gen:sdk:check, test, build:web)
        run: pnpm verify
