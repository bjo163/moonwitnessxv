name: CI Verify & Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    name: Monorepo Verification & Safety Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          check-latest: true
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency advisories
        run: pnpm audit --audit-level=high

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Scan Git history for secrets
        if: ${{ always() && steps.install_dependencies.conclusion == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:105ac66a57b2bb8afb61a3b8a5dcc4817773d03724a7e8a515214cfe58225556 \
            git --redact=100 --exit-code=1 --no-banner --no-color .

      - name: Record UI consistency report
        # Evidence only: `pnpm verify` below is the gate. This step runs the same
        # script in machine-readable mode so a reviewer can see the ADR-0017
        # ledger debt and the duplicate matrix without reading the log.
        continue-on-error: true
        run: node scripts/check-ui-consistency.mjs --json=ui-consistency.json

      - name: Upload UI consistency report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-consistency
          path: ui-consistency.json
          if-no-files-found: warn


      - name: Run Go RADIUS runtime tests
        working-directory: apps/isp-radius
        run: go test ./...
      - name: Run Monorepo Verification (build, lint, gen:sdk:check, test, build:web)
        run: pnpm verify

  promote:
    name: Promote verified dev to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm dev has not moved and main can fast-forward
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin dev main
          current_dev="$(git rev-parse refs/remotes/origin/dev)"
          current_main="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$current_dev" != "$EXPECTED_SHA" ]]; then
            echo "dev moved after verification; refusing to promote a stale commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$current_main" "$EXPECTED_SHA"; then
            echo "main is not an ancestor of the verified dev commit; refusing promotion."
            exit 1
          fi

      - name: Fast-forward main to the verified dev commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: git push origin "$EXPECTED_SHA:refs/heads/main"

      - name: Tag and publish the promoted release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs --ci
