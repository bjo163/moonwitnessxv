name: CI Verify & Gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    name: Monorepo Verification & Safety Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Monorepo Verification (build, lint, gen:sdk:check, test, build:web)
        run: pnpm verify

  promote:
    name: Promote verified dev to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm dev has not moved and main can fast-forward
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin dev main
          current_dev="$(git rev-parse refs/remotes/origin/dev)"
          current_main="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$current_dev" != "$EXPECTED_SHA" ]]; then
            echo "dev moved after verification; refusing to promote a stale commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$current_main" "$EXPECTED_SHA"; then
            echo "main is not an ancestor of the verified dev commit; refusing promotion."
            exit 1
          fi

      - name: Fast-forward main to the verified dev commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: git push origin "$EXPECTED_SHA:refs/heads/main"
