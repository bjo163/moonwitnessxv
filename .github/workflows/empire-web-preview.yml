name: Empire Web Preview Build

on:
  push:
    branches: [feature/empire-web-vercel]
    paths:
      - 'apps/empire-web/**'
      - 'packages/moonui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/empire-web-preview.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/empire-web/**'
      - 'packages/moonui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/empire-web-preview.yml'

permissions:
  contents: read

jobs:
  build-empire:
    name: Test and Build A-L-L-A-H.COM Only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Build shared dependencies
        run: |
          pnpm --filter @moonwitness/core build
          pnpm --filter @moonwitness/moonui build

      - name: Contract tests
        run: pnpm --filter @moonwitness/empire-web test

      - name: Typecheck
        run: pnpm --filter @moonwitness/empire-web typecheck

      - name: Static production build
        run: pnpm --filter @moonwitness/empire-web build

      - name: Verify exported information pages
        run: node apps/empire-web/test/export-check.mjs

      - name: Install browser for keyboard and mobile checks
        run: pnpm exec playwright install --with-deps chromium --only-shell

      - name: Verify browser navigation
        run: pnpm exec playwright test --config apps/empire-web/playwright.config.mjs

      - name: Confirm bilingual static export
        run: |
          test -f apps/empire-web/out/index.html
          test -f apps/empire-web/out/id.html
          test -f apps/empire-web/out/en.html
          test -f apps/empire-web/out/robots.txt
          echo 'A-L-L-A-H.COM static bilingual preview built successfully.'
