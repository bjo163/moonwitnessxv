name: Auto PR dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-pr:
    name: Ensure sync PR from dev to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check commits and manage PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:refs/remotes/origin/main

          BEHIND_COUNT=$(git rev-list --count refs/remotes/origin/main..HEAD)
          echo "Commits on dev ahead of main: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "dev has no new commits compared to main. No PR needed."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Open sync PR #$EXISTING_PR already exists from dev to main. GitHub will auto-update it with the latest dev commits."
            exit 0
          fi

          echo "No open sync PR found. Creating a new PR from dev to main..."
          gh pr create \
            --base main \
            --head dev \
            --title "chore(release): sync dev to main" \
            --body "## Summary
Automated staging promotion PR from \`dev\` to \`main\`.

### Status
- **Source:** \`dev\`
- **Target:** \`main\`
- **Safety checks:** Validated by \`Monorepo Verification & Safety Gates\`.

### Instructions for Maintainer
When ready to release staged changes to production:
1. Ensure all CI checks are green.
2. Review the commit log and changelog entries.
3. Merge this PR into \`main\`."
