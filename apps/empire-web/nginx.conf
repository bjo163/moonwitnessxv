# Static host for the exported A-L-L-A-H.COM pilot (ADR-0012).
#
# `next build` runs with `output: 'export'`, so there is no Next runtime here:
# every route is a file (`en.html`, `en/about.html`, plus the RSC `*.txt` payload).
# The extensionless route therefore has to resolve against `$uri.html`.

server {
    listen 3010;
    listen [::]:3010;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ADR-0012 keeps the pilot out of search indexes. The pages carry their own
    # <meta name="robots"> tag; this header states the same intent for every
    # response, including the RSC payloads and the 404 document.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The export ships its own 404 document; keep the URL the browser sees.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
