# Static host for the exported A-L-L-A-H.COM pilot (ADR-0012).
#
# `next build` runs with `output: 'export'`, so there is no Next runtime here:
# every route is a file (`en.html`, `en/about.html`, plus the RSC `*.txt` payload).
# The extensionless route therefore has to resolve against `$uri.html`.

server {
    listen 3010;
    listen [::]:3010;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ADR-0016: this host is the canonical, indexable origin (a-l-l-a-h.com).
    # The Vercel preview project keeps the noindex decision through its own
    # X-Robots-Tag header, so the same export is never indexed twice.
    # HSTS starts without includeSubDomains/preload: both are one-way decisions
    # that need every sibling host on HTTPS first.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The export ships its own 404 document; keep the URL the browser sees.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
