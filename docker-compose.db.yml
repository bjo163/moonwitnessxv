# Postgres ONLY — for local development.
#
# `docker-compose.yml` builds and runs the three apps; this file starts just the
# database the hub can point at while everything else runs on the host:
#
#   pnpm db:up      # = docker compose -f docker-compose.db.yml up -d
#   pnpm db:down    # = docker compose -f docker-compose.db.yml down
#
# Then point the root .env at it (the identity comes from the same three vars):
#   DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
# Leave DATABASE_URL empty to keep the zero-config in-memory engine.
#
# The volume and container names are pinned to the ones used by the full compose
# file, and `name` stays `moonwitness` on purpose: both files describe ONE Compose
# project, so this file can start the database the full stack already uses instead
# of a second Postgres bound to the same data directory (two servers on one
# pgdata volume corrupt it). The cost is a cosmetic "orphan containers" notice
# when the rest of the stack is up.
#
# The db block below is kept identical to docker-compose.yml's db block — same
# image, healthcheck, ports and mounts. A differing mount list changes the service
# config hash, which made `pnpm db:up` recreate the running database container.
name: moonwitness

services:
  db:
    image: postgres:17-alpine
    container_name: moonwitness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # loopback only: the host toolchain connects here, the internet cannot
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only dump volume, same as docker-compose.yml: the rollback recipe in
      # docs/audit/M04-06-schema-upgrade-rollback.md restores from `/backups` in
      # this container, so db-only mode has to expose it too.
      - db-backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: moonwitness_pgdata
  db-backups:
    name: moonwitness_db_backups
