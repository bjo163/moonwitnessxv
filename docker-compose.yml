name: moonwitness

# Every secret/credential comes from the environment or the .env file next to
# this compose file — never from a value committed here.
#
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB   database identity
#   MOONQL_AUTH_ADMIN_PASSWORD                        seeded HQ admin
#   WHATSAPP_ENABLED / WHATSAPP_AUTO_CONNECT          IM channel
#   SKYLINK_SERVICE_KEY                               ARSY-to-SKYLINK credential (required with profile `skylink` and flag on)
#   SKYLINK_TELEGRAM_BOT_TOKEN / SKYLINK_TELEGRAM_WEBHOOK_SECRET
#                                                     optional Telegram provider credentials
#   DENPA_ENABLED / DENPA_TOKEN                       inbound webhook
#   CORS_ORIGIN                                       comma-separated allow-list
#
# Behaviour knobs (log level, rate limit, retention windows, egress deny list,
# pseudonym salt, bot copy) are read from the same .env as the hub itself, each
# with the production-safe default spelled out below. MOONQL_ACL_POLICY is the
# deliberate exception: it is pinned, never widened from the environment.
#
# Why the database identity uses `:-` and not `:?`: `docker compose build`
# interpolates this whole file before it builds any image, and hosted builders
# such as Coolify hand that step only their build-time variables. A required
# interpolation therefore fails every deploy before a single image is built.
# Nothing falls back to a known password — with POSTGRES_PASSWORD unset the
# postgres image refuses to initialise an empty volume, and moonql-auth throws
# at seed time in production when MOONQL_AUTH_ADMIN_PASSWORD is empty, so a
# missing secret still fails loudly, just at container start instead of at parse.
# The identifiers default to the same names .env.example documents.

x-db-identity: &db-identity
  POSTGRES_USER: ${POSTGRES_USER:-moonwitness}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_DB: ${POSTGRES_DB:-moonwitness}

services:
  db:
    image: postgres:17-alpine
    container_name: moonwitness-db
    restart: unless-stopped
    environment: *db-identity
    ports:
      # loopback only: local `pnpm dev` connects here, the internet cannot
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only view of the dumps, so the rollback recipe in
      # docs/audit/M04-06-schema-upgrade-rollback.md can restore straight from
      # `/backups/<dump>` inside this container. Only `backup` writes there.
      - db-backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moonwitness} -d ${POSTGRES_DB:-moonwitness}"]
      interval: 5s
      timeout: 3s
      retries: 10

  arsy:
    build:
      context: .
      dockerfile: Dockerfile
    image: moonwitness
    container_name: moonwitness
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # loopback like every other service: the proxy reaches the hub by service
      # name over the compose network, so a host-wide publish only exposes the
      # API on the box's public IP, outside TLS and CORS
      - "127.0.0.1:3000:3000"
    environment:
      <<: *db-identity
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Everything from here down honours .env. The hub validates each value at
      # boot (apps/arsy/src/config.ts), so a malformed one fails the container
      # with a readable list instead of quietly keeping the image default.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # the healthcheck below interpolates the same value: prefix and probe
      # cannot end up disagreeing about where the API lives
      API_PREFIX: ${API_PREFIX:-/api/v1}
      # ARSY_TITLE is the preferred spelling; RADIO_TITLE and the generic
      # API_TITLE stay host-side aliases. Exactly one title is forwarded on
      # purpose: the hub refuses to boot when two configured aliases disagree,
      # so forwarding all three would resurrect that failure mode here.
      ARSY_TITLE: ${ARSY_TITLE:-Moonwitness Hub API}
      # unauthenticated entry points (/auth/login, /listen)
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # the two frontends by default; "*" reflects every origin and must be a
      # deliberate choice, not the shipped default
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-moonwitness}
      MOONQL_AUTOSYNC: ${MOONQL_AUTOSYNC:-true}
      # addon-declared crons (e.g. auth session purge, ops retention) arm at boot
      MOONQL_CRON_ENABLED: ${MOONQL_CRON_ENABLED:-true}
      # no empty tables: warn | require (fail boot) | off
      MOONQL_SEED_POLICY: ${MOONQL_SEED_POLICY:-warn}
      # a REST model without a write rule is anonymous-writable -> refuse to boot.
      # Pinned on purpose (docs/audit/M03-02): the local .env says `warn`, and a
      # production stack must not inherit a looser gate from a developer machine.
      MOONQL_ACL_POLICY: require
      # only trust X-Forwarded-* when a real proxy terminates in front of the hub
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # moonql-auth: admin password seeded once (change it for every deployment)
      MOONQL_AUTH_ADMIN_PASSWORD: ${MOONQL_AUTH_ADMIN_PASSWORD:-}
      # D06 validates private-media references against ECHOLOG server-side. Without
      # this the hub falls back to 127.0.0.1:3006 — itself, inside its own container.
      ECHOLOG_URL: ${ECHOLOG_URL:-http://echolog:3006}
      # the hub advertises both frontends on GET /
      DOCK_URL: ${DOCK_URL:-http://localhost:3001}
      HQ_URL: ${HQ_URL:-http://localhost:3002}
      # moonql-ops: retention windows (days) for the two log tables
      OPS_AUDIT_RETENTION_DAYS: ${OPS_AUDIT_RETENTION_DAYS:-14}
      OPS_JOB_RETENTION_DAYS: ${OPS_JOB_RETENTION_DAYS:-7}
      # moonql-playlog: listen events hold visitor-derived data
      PLAYLOG_RETENTION_DAYS: ${PLAYLOG_RETENTION_DAYS:-90}
      # rotating this re-identifies every listener at once (see .env.example);
      # empty behaves exactly like an unset value, so it cannot silently rotate
      PLAYLOG_PSEUDONYM_SALT: ${PLAYLOG_PSEUDONYM_SALT:-}
      # opt-in outbound fetches (station probe + now-playing metadata)
      EGRESS_ENABLED: ${EGRESS_ENABLED:-false}
      # hostnames the egress gate refuses on top of db/arsy/radio/dock/headquarters
      EGRESS_DENY_HOSTS: ${EGRESS_DENY_HOSTS:-}
      # WhatsApp (Baileys) — persist the multi-device session on a volume.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_AUTO_CONNECT: ${WHATSAPP_AUTO_CONNECT:-false}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
      WHATSAPP_BOT_ENABLED: ${WHATSAPP_BOT_ENABLED:-true}
      WHATSAPP_BOT_GREETING: ${WHATSAPP_BOT_GREETING:-Moonwitness WhatsApp bot is online.}
      # DENPA 電波 inbound webhook: off unless a token is supplied (see module).
      DENPA_ENABLED: ${DENPA_ENABLED:-false}
      DENPA_TOKEN: ${DENPA_TOKEN:-}
      # SKYLINK owns provider channel identity when explicitly enabled.
      SKYLINK_ENABLED: ${SKYLINK_ENABLED:-false}
      SKYLINK_URL: http://skylink:3005
      SKYLINK_SERVICE_KEY: ${SKYLINK_SERVICE_KEY:-}
    volumes:
      - whatsapp-session:/data
    healthcheck:
      # the liveness route says nothing about the database; readiness does.
      # API_PREFIX already carries its leading slash, so no separator is added
      # here: `...3000/` + `/api/v1` probes `//api/v1`, which 404s and would leave
      # the container unhealthy forever — blocking dock and headquarters.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000${API_PREFIX:-/api/v1}/health/ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      default:
        # Existing BFFs and local tools still resolve this same ARSY container
        # through the deprecated `radio` DNS name during the compatibility window.
        aliases:
          - radio

  skylink:
    build:
      context: .
      dockerfile: Dockerfile.skylink
    image: moonwitness-skylink
    container_name: moonwitness-skylink
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3005"
      DATABASE_URL: postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-moonwitness}
      SKYLINK_ARSY_URL: http://arsy:3000
      SKYLINK_SERVICE_KEY: ${SKYLINK_SERVICE_KEY:-}
      # SKYLINK gracefully falls back to health-only mode when the service key
      # is not configured, allowing the container to start without full functionality.
      SKYLINK_TELEGRAM_BOT_TOKEN: ${SKYLINK_TELEGRAM_BOT_TOKEN:-}
      SKYLINK_TELEGRAM_WEBHOOK_SECRET: ${SKYLINK_TELEGRAM_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      default:
        aliases:
          - skylink

  # AI Gateway: OpenAI-compatible router. Providers stay off unless AI_ENABLED=true
  # and a provider key is present; /health answers either way.
  aigateway:
    build:
      context: .
      dockerfile: Dockerfile.aigateway
    image: moonwitness-aigateway
    container_name: moonwitness-aigateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      AI_GATEWAY_PORT: "3003"
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # No Ollama daemon runs inside this container: point OLLAMA_HOST at a real
      # one and set this to false before relying on the local model.
      OLLAMA_DISABLED: ${OLLAMA_DISABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ECHOLOG (D19): content-addressed storage on its own volume. Objects and their
  # sidecars survive a container replacement. The operator console is a separate
  # Vite build and is not served by this service.
  echolog:
    build:
      context: .
      dockerfile: Dockerfile.echolog
    image: moonwitness-echolog
    container_name: moonwitness-echolog
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      NODE_ENV: production
      ECHOLOG_HOST: 0.0.0.0
      ECHOLOG_PORT: "3006"
      ECHOLOG_ARSY_URL: http://arsy:3000
      # Production mode refuses to boot without a >=32-char service key, a
      # >=32-char grant secret and an S3 bucket (apps/echolog/src/config.ts).
      # Leave them unset only for a filesystem-only development run.
      ECHOLOG_SERVICE_KEY: ${ECHOLOG_SERVICE_KEY:-}
      ECHOLOG_GRANT_SECRET: ${ECHOLOG_GRANT_SECRET:-}
      ECHOLOG_STORAGE_ROOT: /data/echolog
      ECHOLOG_STORAGE_QUOTA_BYTES: ${ECHOLOG_STORAGE_QUOTA_BYTES:-10737418240}
      ECHOLOG_MAX_UPLOAD_BYTES: ${ECHOLOG_MAX_UPLOAD_BYTES:-52428800}
      ECHOLOG_S3_BUCKET: ${ECHOLOG_S3_BUCKET:-}
      ECHOLOG_S3_REGION: ${ECHOLOG_S3_REGION:-us-east-1}
      ECHOLOG_S3_ACCESS_KEY_ID: ${ECHOLOG_S3_ACCESS_KEY_ID:-}
      ECHOLOG_S3_SECRET_ACCESS_KEY: ${ECHOLOG_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - echolog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  headquarters:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: headquarters
        APP_PORT: "3002"
    image: moonwitness-headquarters
    container_name: moonwitness-headquarters
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy
    ports:
      # Loopback only: the proxy reaches HQ over the compose network, and HQ is
      # login-gated, so no host-wide binding (M27-10).
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: production
      # follows API_PREFIX so a renamed prefix cannot leave the BFF dialling a
      # path the hub no longer serves. The host is the service name, not the
      # `radio` alias: Coolify attaches every service to its own network, and an
      # alias declared under compose's `default` network is not registered where
      # the other services resolve it (ENOTFOUND radio at hq/dock/orbit).
      RADIO_API_URL: http://arsy:3000${API_PREFIX:-/api/v1}
      SITE_NAME: ${SITE_NAME:-Moonwitness}
      HQ_URL: ${HQ_URL:-http://localhost:3002}
      DOCK_URL: ${DOCK_URL:-http://localhost:3001}
      # plain HTTP inside compose: a secure cookie would never come back.
      # Put the app behind TLS and set HQ_COOKIE_SECURE=true.
      HQ_COOKIE_SECURE: ${HQ_COOKIE_SECURE:-false}
    healthcheck:
      # the image is Debian slim (no curl/wget): node is the one tool guaranteed here.
      # /login, not /: the auth middleware redirects an anonymous `/` (M01-02
      # probes the same public page), and a readiness gate should not depend on
      # a redirect chain to prove the app answers.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/login').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dock:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: dock
        APP_PORT: "3001"
    image: moonwitness-dock
    container_name: moonwitness-dock
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy
    ports:
      # Loopback only: Coolify's proxy reaches dock over the compose network, and
      # a host-wide binding would expose the site even when no domain is attached
      # (M27-10). The host port is override-able because the Coolify host already
      # runs another product on 127.0.0.1:3001; the default keeps local
      # `docker compose up` on the port the dev runner documents.
      - "127.0.0.1:${DOCK_HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      # follows API_PREFIX, same reason as headquarters (and dials the service
      # name for the same reason: the `radio` alias is not on Coolify's network)
      RADIO_API_URL: http://arsy:3000${API_PREFIX:-/api/v1}
      SITE_NAME: ${SITE_NAME:-Moonwitness}
      DOCK_URL: ${DOCK_URL:-http://localhost:3001}
      # canonical and sitemap origin, read per request; empty keeps the local
      # FRONTEND_URLS.dock default. DOCK_URL alone does not set it.
      DOCK_PUBLIC_URL: ${DOCK_PUBLIC_URL:-}
      # origins allowed to frame /embed/*; empty keeps 'none' everywhere
      EMBED_ORIGINS: ${EMBED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ORBIT frontend, built from the shared web image. ORBIT ships no public/
  # directory, which is why Dockerfile.web creates one before the runtime copy.
  orbit:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: orbit
        APP_PORT: "3007"
    image: moonwitness-orbit
    container_name: moonwitness-orbit
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      NODE_ENV: production
      RADIO_API_URL: http://arsy:3000${API_PREFIX:-/api/v1}
      SITE_NAME: ${SITE_NAME:-Moonwitness}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SENTINEL worker: a poller with no HTTP surface, so the probe can only prove
  # the worker process is alive. It makes no readiness claim — a heartbeat file or
  # metrics endpoint is the follow-up if this must gate a deployment.
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    image: moonwitness-sentinel
    container_name: moonwitness-sentinel
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RADIO_API_URL: http://arsy:3000${API_PREFIX:-/api/v1}
      AI_GATEWAY_URL: http://aigateway:3003
      SENTINEL_DRIVERS: ${SENTINEL_DRIVERS:-rss,api,playwright,openclaw,agent}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_BEARER_TOKEN: ${SENTINEL_BEARER_TOKEN:-}
      SENTINEL_WORKER_ID: ${SENTINEL_WORKER_ID:-sentinel}
      SENTINEL_POLL_MS: ${SENTINEL_POLL_MS:-15000}
      # the hub's egress gate still owns every outbound host decision
      EGRESS_ENABLED: ${EGRESS_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # A-L-L-A-H.COM pilot (ADR-0012): a statically exported site served by nginx.
  # No backend, no database and no runtime dependency on the hub — the container
  # holds files only, and X-Robots-Tag keeps it out of indexes.
  empire-web:
    build:
      context: .
      dockerfile: Dockerfile.empire-web
    image: moonwitness-empire-web
    container_name: moonwitness-empire-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      # nginx:alpine has no node; busybox wget is the one client guaranteed there.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3010/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  # No backup sidecar: dumps are produced manually with scripts/db-backup.sh,
  # and `db` still mounts this volume read-only for the rollback recipe.
  pgdata:
    name: moonwitness_pgdata
  db-backups:
    name: moonwitness_db_backups
  echolog-data:
    name: moonwitness_echolog_data
  whatsapp-session:
